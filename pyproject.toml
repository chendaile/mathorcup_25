[tool.poetry]
name = "mathorcup-25"
version = "0.2.0"
description = "YOLO training utilities for MathOrCup 2025"
authors = ["chendaile <3185854290@qq.com>"]
readme = "README.md"
packages = [
    {include = "mathorcup_25", from = "src"}
]

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
priority = "explicit"

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
torch = {version = ">=2.0.0", source = "pytorch"}
torchvision = {version = ">=0.18.0", source = "pytorch"}
ultralytics = ">=8.3.221,<9.0.0"
clearml = ">=2.0.2,<3.0.0"
anomalib = ">=2.2.0,<3.0.0"
roboflow = ">=1.2.11,<2.0.0"
opencv-contrib-python = ">=4.12.0.88,<5.0.0.0"

[tool.poetry.scripts]
mathorcup-train-yolo = "mathorcup_25.train_yolo:main"
mathorcup-inference-yolo = "mathorcup_25.inference_yolo:main"
show-diff = "mathorcup_25.showdiff_GenerativeAdversarial_models:main"
train-split = "mathorcup_25.train_split:main"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"